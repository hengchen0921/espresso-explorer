<!doctype html>
<html lang="en">
  <head>
    <script>
      // Before first paint, or the page flashes dark on a light-theme reload.
      try {
        var t = localStorage.getItem('espresso-explorer:theme')
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'
      } catch (e) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17120F" />
    <meta
      name="description"
      content="Take apart eight home espresso machines in 3D — from a $249 compact to a $1,599 dual boiler — and find out which one belongs on your counter."
    />
    <title>Espresso Explorer — an interactive espresso machine buying guide</title>
    <meta property="og:title" content="Espresso Explorer" />
    <meta
      property="og:description"
      content="Eight home espresso machines rebuilt in 3D at true scale. Click any component to find out what it does and why it matters."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..900,0..100,0..1&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
